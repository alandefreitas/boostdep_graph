name: Continuous Integration

on:
  schedule:
    - cron: "0 1 * * *"

  push:
    branches:
      - develop
      - master
      - main
    paths-ignore:
      - 'libs/**'
      - 'data.js'

  pull_request:
    branches:
      - develop
      - master
      - main
    paths-ignore:
      - 'libs/**'
      - 'data.js'

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}

    strategy:
      matrix:
        include:
          - { name: "Update Pages", os: ubuntu-22.04 }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Unit tests
        run: |
          python -m unittest discover -s tests
          node --test tests/*.test.mjs

      - name: Boost Clone
        uses: ./.github/actions/boost_clone
        with:
          boost_dir: boost
          branch: develop
          patches: https://github.com/cppalliance/capy.git,https://github.com/cppalliance/corosio.git,https://github.com/cppalliance/http.git,https://github.com/cppalliance/websocket.git,https://github.com/cppalliance/beast2.git

      - name: Build Boostdep
        working-directory: boost
        run: |
          cd tools/build
          ./bootstrap.sh
          b2_executable=$(pwd)/b2
          cd ../..
          $b2_executable tools/boostdep/build

      - name: Symlink tools
        working-directory: boost
        run: |
          for tool in "tools"/*/; do   tool_name=$(basename ${tool}); ln -sfn "../tools/${tool_name}" "libs/${tool_name}"; done

      - name: Generate data
        run: |
          python main.py -v --boost-root ./boost --boostdep ./boost/dist/bin/boostdep --output-dir .

      - name: Identify auto-commit
        if: startswith(github.event.commits[0].message, 'Update Pages')
        run: echo "is-auto-commit=true" >> $GITHUB_ENV

      - name: Commit
        if: github.event_name != 'pull_request' && env.is-auto-commit != 'true'
        run: |
          if [ -z "$(git status --porcelain data.js libs)" ]; then
            exit 0
          fi
          cur_date=$(date +"%d %B, %Y")
          git_author=$(git log -n 1 --format='%an')
          git_email=$(git log -n 1 --format='%ae')
          git config --global user.name "$git_author"
          git config --global user.email "$git_email"
          git add data.js libs
          git commit -m "Update Pages ($cur_date)"
          git push
