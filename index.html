<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boost Dependency Graph</title>
<meta name="description" content="Interactive map of how the libraries in Boost depend on each other: select a library to see what it needs and who needs it.">
<meta name="color-scheme" content="dark light">
<script>try{if(localStorage.getItem('bdg-theme')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="sym-buildable" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" class="sym-bg"/><path d="M8 3.2 12.2 5.6v4.8L8 12.8 3.8 10.4V5.6z M8 3.2v4.8m0 0 4.2-2.4M8 8 3.8 5.6M8 8v4.8" class="sym-line"/></symbol>
    <symbol id="sym-tool" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" class="sym-bg"/><path d="M10.6 3.6a3 3 0 0 0-3.4 3.9L3.8 10.9a1.1 1.1 0 0 0 1.6 1.6l3.4-3.4a3 3 0 0 0 3.9-3.4L10.8 7 9.2 6.8 9 5.2z" class="sym-fill"/></symbol>
    <symbol id="sym-deprecated" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" class="sym-bg"/><circle cx="8" cy="8" r="4.6" class="sym-line sym-red"/><path d="m4.9 11.1 6.2-6.2" class="sym-line sym-red"/></symbol>
    <symbol id="sym-proposed" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" class="sym-bg"/><path d="M8 2.5C8.4 5.4 9.6 7.6 13 8 9.6 8.4 8.4 10.6 8 13.5 7.6 10.6 6.4 8.4 3 8 6.4 7.6 7.6 5.4 8 2.5z" class="sym-fill sym-orange"/></symbol>
  </defs>
</svg>

<header class="topbar" id="topbar">
  <div class="brand">
    <h1>Boost Dependency Graph</h1>
    <p class="subtitle">Pick a library to see what it needs and who needs it.</p>
  </div>
  <div class="search" role="search">
    <input id="search" type="search" placeholder="Search libraries  ( / )" autocomplete="off" spellcheck="false" aria-label="Search libraries" role="combobox" aria-expanded="false" aria-controls="search-results">
    <ul id="search-results" class="results" role="listbox" hidden></ul>
  </div>
  <div class="topbar-right">
    <span id="stamp" class="stamp"></span>
    <button id="theme" class="icon-btn" type="button" aria-label="Toggle light and dark theme" title="Toggle theme"></button>
  </div>
</header>

<div class="mbar" id="mbar">
  <button type="button" id="m-legend" class="mbtn" aria-controls="legend" aria-expanded="false">Legend &amp; options</button>
  <button type="button" id="m-view" class="mbtn">Full graph</button>
</div>

<main class="layout">
  <section id="focus" class="focus" aria-label="Library neighborhood"></section>
  <aside id="legend" class="legend" aria-label="Legend and options"></aside>
  <section class="stage" id="stage">
    <div id="notice" class="notice" role="status" hidden></div>
    <svg id="graph" class="graph" role="img" aria-label="Boost library dependency graph"></svg>
    <div class="zoom-controls">
      <button type="button" id="zoom-in" class="icon-btn" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" id="zoom-out" class="icon-btn" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button type="button" id="view-around" class="icon-btn" aria-label="Around the selected library" disabled></button>
      <button type="button" id="view-deps" class="icon-btn" aria-label="Dependencies of the selected library" disabled></button>
      <button type="button" id="view-dependants" class="icon-btn" aria-label="Dependents of the selected library" disabled></button>
      <button type="button" id="zoom-fit" class="icon-btn" aria-label="Fit graph to view" title="Fit">&#9635;</button>
    </div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </section>
  <aside id="details" class="details" aria-label="Library details" hidden></aside>
</main>
<div id="scrim" class="scrim"></div>
<footer id="foot" class="foot"></footer>

<script src="data.js" charset="utf-8"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
